<title>Jahresringe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: eine Smartphone-Spalte – fester Status oben, Inhalt als Karten, Aktionsleiste unten. Jahresringe als Leitmotiv. */
:root {
  --bg: #ECEFE7; --surface: #FAFBF7; --surface-2: #E2E7DA; --line: #D1D8C9;
  --ink: #1A2520; --ink-2: #536059; --ink-3: #7A857D;
  --moss: #2D5944; --moss-2: #3E785C; --on-moss: #F3F7F1;
  --sap: #B9781A; --sap-soft: #F2E2C3; --bark: #7A5A40;
  --good: #2C7A4D; --bad: #B03A2E; --good-soft: #DCEADF; --bad-soft: #F3DDD8;
  --scrim: rgba(12, 18, 15, 0.46); --shadow: 0 1px 2px rgba(26,37,32,.05), 0 6px 18px rgba(26,37,32,.07);
  --f-display: 'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body: 'Familjen Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 16px; --r-sm: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1411; --surface: #161E19; --surface-2: #202A24; --line: #2B3730;
  --ink: #E6ECE5; --ink-2: #A2AFA6; --ink-3: #7B887F;
  --moss: #7DB997; --moss-2: #5E9C7A; --on-moss: #0B140F;
  --sap: #E2A64A; --sap-soft: #3A2E17; --bark: #B48F70;
  --good: #6EC28F; --bad: #E87D6E; --good-soft: #1B3326; --bad-soft: #3B201C;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #161E19; --surface-2: #202A24; --line: #2B3730;
  --ink: #E6ECE5; --ink-2: #A2AFA6; --ink-3: #7B887F;
  --moss: #7DB997; --moss-2: #5E9C7A; --on-moss: #0B140F;
  --sap: #E2A64A; --sap-soft: #3A2E17; --bark: #B48F70;
  --good: #6EC28F; --bad: #E87D6E; --good-soft: #1B3326; --bad-soft: #3B201C;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); margin: 0; overflow-x: hidden;
  touch-action: manipulation; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--sap); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--bad); }
.pos { color: var(--good); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 16px; height: 16px; }

#app { max-width: 600px; margin: 0 auto; min-height: 100vh; }

/* ---------- Status oben ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 16px 9px; border-bottom: 1px solid var(--line); }
.hud-top { display: flex; align-items: center; gap: 11px; }
.hud-top .who { flex: 1; min-width: 0; }
.hud .name { font: 20px/1.15 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gen { font: 700 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--sap); border: 1.5px solid var(--sap); border-radius: 999px; padding: 6px 9px; white-space: nowrap; }
.hud-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px 10px; margin-top: 9px; }
.cell { min-width: 0; }
.cell .l { font: 600 10.5px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.cell .v { font: 600 15px/1.3 var(--f-body); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .bar { margin-top: 3px; height: 4px; }
.rings { flex: none; display: block; }
.rings.grow { animation: grow .7s cubic-bezier(.2,.8,.2,1); }
@keyframes grow { 0% { transform: scale(.86) rotate(-8deg); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

/* ---------- Inhalt ---------- */
.view { padding: 14px 16px calc(150px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card > h3, .sec { font: 700 11.5px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.card > h3 .aside { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 12.5px; color: var(--ink-3); }
.big { font: 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.lead { font: 19px/1.25 var(--f-display); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child, h3 + .row, .sec + .row { border-top: 0; }
.row .k { color: var(--ink-2); min-width: 0; }
.row .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.row.total { border-top: 1.5px solid var(--ink-3); font-weight: 700; }
.row.wrap .v { white-space: normal; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.note.warn { background: var(--sap-soft); color: var(--ink); }
.note.bad { background: var(--bad-soft); color: var(--ink); }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); padding: 9px 14px; font-weight: 600; font-size: 14.5px; text-align: center; line-height: 1.2; }
.btn.primary { background: var(--moss); color: var(--on-moss); border-color: transparent; }
.btn.accent { background: var(--sap); color: #1A1206; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.full { width: 100%; }
.btn.sm { min-height: 38px; padding: 7px 11px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 13.5px; padding: 6px 4px; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); z-index: 5; }

.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--moss); }
.bar.sap > i { background: var(--sap); } .bar.bad > i { background: var(--bad); } .bar.good > i { background: var(--good); }
.stat { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 6px 0; }
.stat .bar { grid-column: 2 / 4; }
.stat .lab { font-weight: 600; }
.stat .val { font-variant-numeric: tabular-nums; font-weight: 600; }
.stat svg.i { color: var(--ink-2); grid-row: span 2; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.sap { background: var(--sap-soft); color: var(--sap); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 11px; min-height: 58px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); }
.act > span { min-width: 0; }
.act .t { font-weight: 600; font-size: 14px; line-height: 1.2; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.act .d { font-size: 12px; color: var(--ink-3); line-height: 1.25; }
.act > svg.i { color: var(--moss); }
.act:disabled { opacity: .5; }
.act:disabled > svg.i { color: var(--ink-3); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--sap); }
.pips i.on { background: var(--sap); }

.item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child, h3 + .item { border-top: 0; padding-top: 2px; }
.item .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--moss); }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 600; line-height: 1.25; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.item .d { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.item .r { text-align: right; flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.item .r .d { font-weight: 500; }
button.item { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; }
.ladder { display: flex; gap: 4px; margin: 10px 0 4px; }
.ladder i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.ladder i.on { background: var(--moss); } .ladder i.cur { background: var(--sap); }

/* ---------- Aktionsleiste unten ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px calc(4px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 576px; margin: 0 auto; }
.next { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--moss); color: var(--on-moss); font: 600 17px/1 var(--f-body); display: flex; align-items: center; justify-content: center; gap: 10px; }
.next .to { font-weight: 500; opacity: .8; font-size: 14px; }
.next.pending { background: var(--sap); color: #1A1206; }
.next.pending b { background: rgba(0,0,0,.15); border-radius: 99px; padding: 3px 8px; font-size: 13px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 4px; }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; min-height: 50px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--moss); }
.tabs button svg.i { width: 22px; height: 22px; }

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; }
.sheet { position: relative; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .24s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font: 23px/1.2 var(--f-display); margin-bottom: 6px; }
.sheet .x { position: absolute; z-index: 3; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.ev-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; padding-right: 40px; }
.ev-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--sap-soft); color: var(--sap); flex: none; }
.ev-ic svg.i { width: 24px; height: 24px; }
.ev-cat { font: 700 11px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.ev-text { font-size: 16px; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; min-height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 11px 14px; }
.choice .ct { font-weight: 700; font-size: 15.5px; }
.choice .cd { font-size: 13px; color: var(--ink-2); }
.choice .cw { font-size: 12.5px; color: var(--bad); }
.choice:not(:disabled):active { border-color: var(--moss); }
.choice:disabled { opacity: .55; }
.result { font: 19px/1.35 var(--f-display); margin: 6px 0 12px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.input { width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); padding: 10px 12px; font-size: 16px; }
.input:focus { border-color: var(--moss); outline: none; }
textarea.input { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); z-index: 70; width: min(560px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; line-height: 1.35; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- Charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10px var(--f-body); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stackbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.stackbar span { display: block; height: 100%; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.tile .l { font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tile .v { font: 19px/1.25 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }
.tile .d { font-size: 12.5px; color: var(--ink-2); }
.genbar { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 13px; }
.genbar .b { height: 18px; border-radius: 6px; background: var(--moss); min-width: 3px; }
.genbar .b.cur { background: var(--sap); }

/* ---------- Menü & Start ---------- */
.screen { padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 18px 0 6px; }
.brand h1 { font: 44px/1 var(--f-display); letter-spacing: -.01em; }
.brand p { color: var(--ink-2); font-size: 15.5px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; }
.opt[aria-pressed="true"] { border-color: var(--moss); box-shadow: inset 0 0 0 1px var(--moss); }
.opt .t { font-weight: 700; }
.opt .d { font-size: 13px; color: var(--ink-2); }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.death-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding-top: 6px; }
.death-head h1 { font: 32px/1.1 var(--f-display); }
.log-y { font: 700 12px/1 var(--f-body); color: var(--sap); letter-spacing: .06em; padding-top: 12px; }
.log-e { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); font-size: 14px; }
.log-e.k-big { border-left-color: var(--sap); font-weight: 600; }
.log-e.k-good { border-left-color: var(--good); } .log-e.k-bad { border-left-color: var(--bad); }
.switch { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink-3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--moss); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-moss); }
/* ---------- Illustrationen ---------- */
.ill { display: block; width: 100%; height: auto; }
.ill .bg { fill: var(--surface-2); } .ill .g { fill: var(--moss); opacity: .16; }
.ill .m { fill: var(--moss); } .ill .m2 { fill: var(--moss-2); } .ill .s { fill: var(--sap); } .ill .k { fill: var(--bark); }
.ill .w { fill: var(--surface); } .ill .l { fill: var(--line); } .ill .i { fill: var(--ink-3); } .ill .r { fill: var(--bad); }
.ill .spot { fill: var(--sap-soft); opacity: .85; }
.ill .gear { fill: none; stroke: var(--moss); stroke-width: 6; stroke-dasharray: 5 4.4; }
.ill .sk, .ill .sk2, .ill .sm, .ill .sm2, .ill .sw, .ill .ss, .ill .ss2, .ill .ssk, .ill .sr { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ill .sk { stroke: var(--bark); stroke-width: 4; } .ill .sk2 { stroke: var(--bark); stroke-width: 1.6; } .ill .ssk { stroke: var(--bark); stroke-width: 3; }
.ill .sm { stroke: var(--moss); stroke-width: 2.2; } .ill .sm2 { stroke: var(--moss); stroke-width: 2; opacity: .4; } .ill .sw { stroke: var(--surface); stroke-width: 2; }
.ill .ss { stroke: var(--sap); stroke-width: 2.4; } .ill .ss2 { stroke: var(--sap); stroke-width: 2; } .ill .sr { stroke: var(--bad); stroke-width: 2.4; }
.hero { position: relative; background: var(--surface-2); border-radius: 14px; display: flex; justify-content: center; overflow: hidden; }
.hero .ill { height: 108px; width: auto; max-width: 100%; }
.hero.ev { margin: 0 0 12px; } .hero.ev .ill { height: 92px; }
.hero.life { justify-content: space-between; align-items: center; gap: 8px; padding-left: 14px; }
.hero.life .ill { height: 96px; flex: none; }
@media (max-width: 360px) { .hero.life .ill { height: 76px; } }
.life-cap { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; line-height: 1.35; color: var(--ink-2); min-width: 0; flex: 1; padding: 10px 0; }
.life-cap b { font: 15px/1.2 var(--f-display); color: var(--ink); font-weight: 400; }
.badge-prem { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px; background: var(--sap); color: #1A1206; font: 700 11px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; }
.ill.thumb { width: 64px; height: 36px; flex: none; }
.thumbw { flex: none; border-radius: 10px; overflow: hidden; display: block; }
.card.prem { border-color: var(--sap); background: linear-gradient(180deg, var(--sap-soft), var(--surface) 140px); }
.ptiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ptile { display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left; padding: 8px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); min-width: 0; }
.ptile .ill.thumb { width: 100%; height: auto; border-radius: 10px; }
.ptile .pt { font-weight: 700; font-size: 14px; line-height: 1.2; }
.ptile .pd { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); line-height: 1.25; min-width: 0; }
.ptile.open { border-color: var(--sap); } .ptile.open .pd { color: var(--sap); font-weight: 600; }
.ptile.on { border-color: var(--moss); } .ptile.on .pd { color: var(--moss); font-weight: 600; }
.ptile.lock .ill { opacity: .55; filter: grayscale(.6); }
.reqs { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.reqs li { display: flex; gap: 8px; align-items: flex-start; } .reqs li svg { margin-top: 2px; }
.reqs li.ok { color: var(--good); } .reqs li.no { color: var(--ink-2); } .reqs li.no svg { color: var(--bad); }
.steps { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.steps span { background: var(--surface-2); border-radius: 8px; padding: 4px 8px; } .steps i { font-style: normal; color: var(--ink-3); }
.proj { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: var(--surface); }
.proj > svg.i { color: var(--sap); } .proj.on { border-color: var(--moss); } .proj.on > svg.i { color: var(--moss); }
.proj .t { font-weight: 700; font-size: 14.5px; } .proj .d { font-size: 12.5px; color: var(--ink-2); }
.trend { display: inline-flex; vertical-align: -2px; margin-left: 3px; }
.toast.ach { background: var(--sap); color: #1A1206; font-weight: 600; }
.btn, .choice, .act, .opt, .ptile, .tabs button, .next { transition: transform .12s ease, background-color .15s; }
.btn:not(:disabled):active, .act:not(:disabled):active, .ptile:active, .next:active, .opt:active { transform: scale(.97); }
.tabs .tb { display: grid; place-items: center; width: 52px; height: 28px; border-radius: 999px; transition: background-color .15s; }
.tabs button[aria-current="page"] .tb { background: var(--good-soft); }
@media (min-width: 560px) { .ptiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 559px) { .ptiles > .ptile:first-child { grid-column: 1 / -1; } .ptiles > .ptile:first-child .ill.thumb { width: auto; height: 96px; align-self: center; } }
.statb { width: 100%; background: none; border: 0; text-align: left; color: inherit; font: inherit; }
.statb .val { display: inline-flex; align-items: center; gap: 2px; } .statb .val svg { color: var(--ink-3); }
.statb:active { background: var(--surface-2); border-radius: 10px; }
.qgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.qgrid .choice { align-items: center; min-height: 60px; } .qgrid .ct { font-size: 20px; }
.sec .aside { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 12.5px; color: var(--ink-3); }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
@media (min-width: 720px) { .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body.nomotion *, body.nomotion *::before, body.nomotion *::after { animation: none !important; transition: none !important; }

    stocks: STOCKS.map(s => Object.assign({}, s, { trend: s.alpha, peak: s.price, hist: [s.price], lastR: 0 })),
    funds: FUNDS.map(f => ({ id: f.id, price: 100, hist: [100], lastR: 0 })) };

function updateMarket(S) {

    if (next !== M.phase) { M.phase = next; M.py = 0; }
  }

    if (f.id === 'krypto') {

      else if (chance(0.05)) r += 0.8;

/* ===================== FINANZEN ===================== */

function celebIncome(S) {

}

/* ---------- Jahresringe ---------- */
function ringsSvg(S, size, years, cls) {
  const hist = S.hist.slice(-(years || 200));
  const n = Math.max(hist.length, 1), R = size / 2 - 1, step = R / (n + 0.8);
  let out = '<svg class="rings' + (cls ? ' ' + cls : '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">';
  out += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + R + '" style="fill:var(--sap-soft)"/>';
  hist.forEach((h, i) => {
    const r = step * (i + 0.8);
    const col = h.hp >= 66 ? 'var(--sap)' : h.hp >= 38 ? 'var(--moss)' : 'var(--bark)';
    const w = Math.max(0.6, step * (h.net > 0 ? 0.62 : h.net < 0 ? 0.28 : 0.42));
    out += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r.toFixed(2) + '" style="fill:none;stroke:' + col + ';stroke-width:' + w.toFixed(2) + '"/>';
  });
  out += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + R + '" style="fill:none;stroke:var(--bark);stroke-width:1.4"/></svg>';
  return out;
}

/* ---------- Diagramme ---------- */
function lineChart(series, o) {
  o = o || {}; const W = 340, H = o.h || 150, L = 4, Rr = 6, T = 14, B = 18;
  const all = series.flatMap(s => s.pts.map(p => p.y)).filter(isFinite);
  if (!all.length || series[0].pts.length < 2) return '<div class="empty">Noch zu wenige Jahre für ein Diagramm.</div>';
  let mn = Math.min(0, ...all), mx = Math.max(...all); if (mx === mn) mx = mn + 1;
  const xs = series[0].pts.map(p => p.x), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const sx = x => L + (x - x0) / Math.max(1, x1 - x0) * (W - L - Rr), sy = y => T + (1 - (y - mn) / (mx - mn)) * (H - T - B);
  let g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Diagramm') + '">';
  for (const f of [0, 0.5, 1]) { const y = T + f * (H - T - B); g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line);stroke-width:1"/>'; }
  if (mn < 0) g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + sy(0) + '" y2="' + sy(0) + '" style="stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3"/>';
  series.forEach(s => {
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');
    if (s.fill) g += '<path d="' + d + ' L' + sx(s.pts[s.pts.length - 1].x).toFixed(1) + ' ' + sy(Math.max(mn, 0)).toFixed(1) + ' L' + sx(s.pts[0].x).toFixed(1) + ' ' + sy(Math.max(mn, 0)).toFixed(1) + 'Z" style="fill:' + s.color + ';opacity:.14"/>';
    g += '<path d="' + d + '" style="fill:none;stroke:' + s.color + ';stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>';
    const lp = s.pts[s.pts.length - 1]; g += '<circle cx="' + sx(lp.x).toFixed(1) + '" cy="' + sy(lp.y).toFixed(1) + '" r="3.6" style="fill:' + s.color + ';stroke:var(--surface);stroke-width:1.5"/>';
  });
  const fy = o.fy || (v => eur(v));
  g += '<text x="' + L + '" y="' + (T - 4) + '">' + esc(fy(mx)) + '</text>';
  if (mn < 0) g += '<text x="' + L + '" y="' + (H - B - 3) + '">' + esc(fy(mn)) + '</text>';
  g += '<text x="' + L + '" y="' + (H - 4) + '">' + esc(o.fx ? o.fx(x0) : x0) + '</text><text x="' + (W - Rr) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(o.fx ? o.fx(x1) : x1) + '</text></svg>';
  if (series.length > 1 || o.legend) g += '<div class="legend">' + series.map(s => '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('') + '</div>';
  return g;
}
function spark(arr, w, h, color) {
  if (!arr || arr.length < 2) return '';
  const mn = Math.min(...arr), mx = Math.max(...arr) || 1, d = arr.map((v, i) => (i ? 'L' : 'M') + (i / (arr.length - 1) * (w - 2) + 1).toFixed(1) + ' ' + (h - 2 - (v - mn) / ((mx - mn) || 1) * (h - 4)).toFixed(1)).join(' ');
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path d="' + d + '" style="fill:none;stroke:' + (color || 'var(--moss)') + ';stroke-width:1.8;stroke-linejoin:round"/></svg>';
}

const Store = {

  save(str) { try { localStorage.setItem(SAVE_KEY, str); UI.local = true; return true; } catch (e) { UI.local = false; return false; } },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* egal */ } },
};
let saveTimer = null;
function scheduleSave() { saveNow(); }
function saveNow() {
  clearTimeout(saveTimer);
  if (!UI.S) return;
  let str; try { str = serialize(UI.S); } catch (e) { return; }
  UI.saveStr = str; UI.saveMeta = metaOf(UI.S);
  Store.save(str);
  cloudSave(str);
}
function metaOf(S) { return { name: fullName(S.char), gen: S.gen, age: age(S), year: S.year, nw: netWorth(S), dead: !!S.dead }; }
function cloudSave(str) {
  const C = UI.cloud; if (!C.ref) return;
  if (str.length > 250000) { C.state = 'zu groß'; return; }
  if (C.writing) { C.pending = str; return; }
  const wait = Math.max(0, 2500 - (Date.now() - C.last));
  C.writing = true;
  setTimeout(() => {
    C.last = Date.now();
    C.ref.set({ savedAt: UI.S ? UI.S.savedAt : Date.now(), v: SAVE_VERSION, data: str }).then(() => { C.state = 'aktiv'; }).catch(() => { C.state = 'fehler'; })
      .finally(() => { C.writing = false; if (C.pending) { const p = C.pending; C.pending = null; cloudSave(p); } });
  }, wait);
}
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    UI.cloud.db = db; UI.cloud.ref = db.doc('data/users/' + uid + '/save');
    const snap = await UI.cloud.ref.get();
    UI.cloud.state = 'aktiv';
    if (snap && snap.exists) {
      const d = snap.data() || {};
      const localAt = UI.S ? UI.S.savedAt : (UI.saveMeta ? UI.saveMeta.savedAt || 0 : 0);
      if (d.data && (d.savedAt || 0) > (localAt || 0) && (UI.screen === 'menu' || UI.screen === 'create')) {
        try { const S = deserialize(d.data); UI.saveStr = d.data; UI.saveMeta = Object.assign(metaOf(S), { savedAt: S.savedAt }); Store.save(d.data); if (UI.screen === 'menu') render(); } catch (e) { /* ungültig */ }
      }
    } else if (UI.saveStr) cloudSave(UI.saveStr);
  } catch (e) { UI.cloud.state = 'aus'; }
}

/* ===================== TON ===================== */
let AC = null;
function sfx(kind) {
  if (!UI.S || !UI.S.settings || !UI.S.settings.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const notes = { tap: [[660, 0.04]], good: [[523, 0.08], [784, 0.12]], bad: [[392, 0.1], [294, 0.16]], year: [[440, 0.07], [554, 0.07], [659, 0.14]], event: [[587, 0.06], [880, 0.1]], death: [[392, 0.25], [330, 0.3], [262, 0.5]], coin: [[988, 0.05], [1319, 0.09]] }[kind] || [[600, 0.05]];
    let t = AC.currentTime;
    for (const [f, d] of notes) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.85;
    }
  } catch (e) { /* kein Ton verfügbar */ }
}

  let h = '';
  let f = '';
  if (!S.biz.length) f += '<div class="empty">Du besitzt keine Firma. Unternehmer verdienen mehr, tragen aber das volle Risiko.</div>';
  for (const b of S.biz) {
    const T = BIZ_TYPES[b.type];
    f += '<div class="item"><span class="ico">' + ic('store') + '</span><span class="body"><span class="t">' + esc(b.name) + '</span><br><span class="d">' + esc(T.name) + ' · ' + (b.level > 1 ? b.level + ' Standorte' : '1 Standort') + ' · ' + (b.staff || 0) + ' Mitarbeiter · ' + b.age + ' J. alt</span>'
      + '<div class="flex" style="margin:6px 0"><span class="pill ' + (b.mode === 'aktiv' ? 'good' : '') + '">' + (b.mode === 'aktiv' ? 'Du führst selbst' : 'Geschäftsführer') + '</span>' + (b.lossY >= 2 ? '<span class="pill bad">' + b.lossY + ' Verlustjahre</span>' : '') + (b.morale != null && b.morale < 35 ? '<span class="pill bad">Schlechte Stimmung</span>' : '') + '</div>'
      + row('Umsatz', eur(b.rev)) + row('Marge', dec(b.margin * 100, 1) + ' %') + row('Gewinn (letztes Jahr)', fmS(b.lastProfit)) + row('Firmenwert', eur(b.value))
      + (b.hist.length > 2 ? '<div style="margin:6px 0">' + spark(b.hist, 120, 26, 'var(--sap)') + '</div>' : '')
      + '<div class="btns" style="margin-top:6px">' + btn('Details & Steuerung', 'bizSheet', { id: b.id }, { cls: 'sm primary' }) + btn('Erweitern · ' + eur(expandCost(S, b)), 'bizExpand', { id: b.id }, { cls: 'sm', off: b.level >= 10 }) + btn('Marketing · ' + eur(round(b.rev * 0.06, 100)), 'bizMarketing', { id: b.id }, { cls: 'sm', off: !!S.turn.marketing[b.id] })
      + btn(b.mode === 'aktiv' ? 'Abgeben' : 'Selbst führen', 'bizMode', { id: b.id }, { cls: 'sm' }) + btn('Verkaufen', 'confirm', { what: 'sellBiz', id: b.id }, { cls: 'sm' }) + btn('Schließen', 'confirm', { what: 'closeBiz', id: b.id }, { cls: 'sm ghost danger' }) + '</div></span></div>';
  }
  h += card('Deine Firmen', f);
  if (a < 18) return h + '<div class="note">Firmen gründen und übernehmen kannst du ab 18.</div>';
  let g = '<p class="muted small" style="margin-bottom:6px">Selbst geführt bringt mehr Gewinn, ersetzt aber deinen Job. Mit Gründerkredit brauchst du nur 40 % Eigenkapital.</p>';
  for (const k in BIZ_TYPES) {
    const T = BIZ_TYPES[k]; if (T.buyOnly) continue;
    const cost = bizCost(S, k), r = bizOk(S, k);
    g += '<div class="item"><span class="ico">' + ic('store') + '</span><span class="body"><span class="t">' + esc(T.name) + '</span><br><span class="d">' + esc(T.desc) + (r.ok ? '' : ' <span class="neg">' + esc(r.msg) + '</span>') + '</span>'
      + '<div class="btns" style="margin-top:8px">' + btn('Gründen', 'found', { t: k, loan: 0 }, { cls: 'sm primary', off: !r.ok || S.fin.cash < cost }) + btn('Mit Kredit', 'found', { t: k, loan: 1 }, { cls: 'sm', off: !r.ok || S.fin.cash < cost * 0.4 }) + '</div></span><span class="r num">' + eur(cost) + '</span></div>';
  }
  h += card('Firma gründen', g);
  let u = '<p class="muted small" style="margin-bottom:6px">Bestehende Firmen mit Personal und Kunden. Mit Übernahmekredit brauchst du 40 % Eigenkapital – die Bank prüft, ob der Gewinn die Rate trägt. Neue Angebote jedes Jahr.</p>';
  for (const o of (S.bizMarket || [])) {
    const b = o.biz, T = BIZ_TYPES[b.type];
    u += '<div class="item"><span class="ico">' + ic('building') + '</span><span class="body"><span class="t">' + esc(b.name) + '</span><br><span class="d">' + esc(T.name) + ' · ' + b.staff + ' Mitarbeiter · ' + b.age + ' J. am Markt<br>Umsatz ' + eur(b.rev) + ' · Gewinn ' + eurS(b.lastProfit) + '/J.</span>'
      + '<div class="btns" style="margin-top:8px">' + btn('Kaufen', 'buyBiz', { id: o.id, loan: 0 }, { cls: 'sm primary', off: S.fin.cash < o.price }) + btn('Mit Kredit · ' + eur(Math.ceil(o.price * 0.4)), 'buyBiz', { id: o.id, loan: 1 }, { cls: 'sm', off: S.fin.cash < o.price * 0.4 }) + '</div></span><span class="r num">' + eur(o.price) + '</span></div>';
  }
  if (!(S.bizMarket || []).length) u += '<div class="empty">Keine Angebote.</div>';
  h += card('Firmen übernehmen', u);
  return h;
}
function bizSheet(id) {
  const S = UI.S, b = S.biz.find(x => x.id === id); if (!b) return;
  const T = BIZ_TYPES[b.type], co = b.costs || {};
  let s = '<h2>' + esc(b.name) + '</h2><p class="muted small">' + esc(T.name) + ' · Branche ' + esc(T.sector || 'Konsum') + ' · ' + b.age + ' J. alt · ' + (b.mode === 'aktiv' ? 'von dir geführt' : 'mit Geschäftsführer') + '</p>';
  s += '<div style="margin:10px 0">' + row('Umsatz', eur(b.rev));
  if (b.demand && b.demand > b.rev * 1.03) s += row('Nicht bediente Nachfrage', '<span class="neg">' + eur(b.demand - b.rev) + '</span>');
  if (co.wages) s += row('Löhne (' + (b.staff || 0) + ' Mitarbeiter)', '−' + eur(co.wages));
  if (co.mgr) s += row('Geschäftsführung', '−' + eur(co.mgr));
  if (co.cogs) s += row('Waren & Material', '−' + eur(co.cogs));
  if (co.fixed) s += row('Miete & Standorte', '−' + eur(co.fixed));
  if (co.other) s += row('Sonstige Kosten', '−' + eur(co.other));
  s += row('Gewinn', fmS(b.lastProfit), 'total') + row('Firmenwert', eur(b.value)) + '</div>';
  if (b.morale != null && T.special !== 'startup') {
    s += '<div class="stat">' + ic('smile') + '<span class="lab">Stimmung</span><span class="val">' + Math.round(b.morale) + '</span>' + bar(b.morale, b.morale < 35 ? 'bad' : 'good') + '</div>'
      + '<div class="stat">' + ic('star') + '<span class="lab">Ruf</span><span class="val">' + Math.round(b.rep) + '</span>' + bar(b.rep, 'sap') + '</div>'
      + '<div class="stat">' + ic('alert') + '<span class="lab">Konkurrenz</span><span class="val">' + Math.round(b.comp) + '</span>' + bar(b.comp, b.comp > 60 ? 'bad' : '') + '</div>';
    s += '<div class="field" style="margin-top:10px"><label>Personalplanung</label>' + seg('staff', Object.keys(BIZ_POLICY.staff).map(k => [k, BIZ_POLICY.staff[k][0]]), b.staffPol, 'bizPol') + '</div>';
    s += '<div class="field" style="margin-top:8px"><label>Löhne</label>' + seg('wages', Object.keys(BIZ_POLICY.wages).map(k => [k, BIZ_POLICY.wages[k][0]]), b.wageLvl, 'bizPol') + '</div>';
    s += '<p class="muted small" style="margin-top:6px">Knappes Personal und niedrige Löhne sparen Kosten, drücken aber Stimmung und Ruf – bis hin zum Streik. Zu wenig Personal kostet Aufträge.</p>';
  }
  if (b.hist.length > 1) s += '<div class="sec" style="margin-top:10px">Gewinn pro Jahr</div>' + lineChart([{ pts: b.hist.map((v, i) => ({ x: S.year - b.hist.length + i, y: v })), color: 'var(--sap)', fill: true }], { h: 110, label: 'Gewinnverlauf' });
  openSheet(s, 'biz:' + id);
}
/* ---------- Familie ---------- */

    ps += '<div class="stat">' + ic('heart') + '<span class="lab">Beziehung</span><span class="val">' + relWord(p.rel) + '</span>' + bar(p.rel, p.rel < 30 ? 'bad' : 'sap') + '</div>';
    ps += '<div class="btns" style="margin-top:8px">' + btn('Zeit verbringen', 'ptime', {}, { cls: 'sm', off: !!S.turn.done.ptime || S.turn.energy < 1 }) + btn('Geschenk', 'pgift', {}, { cls: 'sm', off: !!S.turn.done.pgift })

  } else ps += '<p class="muted">Beziehungen werden ab 16 möglich.</p>';
  h += card('Partnerschaft', ps);
  // Kinder
  const kids = S.fam.kids;
  let ks = '';

  for (const k of kids) {
    const ka = pAge(S, k), heir = S.fam.heirId === k.id;
    const what = !k.alive ? 'verstorben' : ka < 6 ? 'Kleinkind' : ka < 10 ? 'Grundschule' : ka < 18 ? (k.school && SCHOOLS[k.school] ? SCHOOLS[k.school].name : 'Schule') : k.cur ? (k.cur.kind === 'uni' ? 'Studium ' + FIELDS[k.cur.field].name.replace(/ \(.*\)/, '') + (k.stip ? ' (Stipendium)' : k.funded ? ' (von dir finanziert)' : '') : 'Ausbildung') : k.job ? jobTitle(k.job) : k.retired ? 'Rente' : 'ohne Job';
    const tr = k.trait && TRAITS[k.trait] ? TRAITS[k.trait].name : '';
    const gk = (k.kids || []).map(g => esc(g.first) + ' (' + Math.max(0, S.year - g.birthYear) + ')');
    ks += '<div class="item"><span class="ico">' + ic('person') + '</span><span class="body">' + personLine(S, k, esc(what)) + (heir && k.alive ? ' <span class="pill sap">Haupterbe</span>' : '') + (k.adopted ? ' <span class="pill">adoptiert</span>' : '')
      + (k.alive ? '<div class="small muted" style="margin-top:4px">' + (tr ? 'Wesen: ' + esc(tr) + (k.interests && k.interests.length ? ' · mag ' + esc(k.interests.join(', ')) : '') + '<br>' : '') + 'Intelligenz ' + Math.round(k.st.smarts) + ' · Gesundheit ' + Math.round(k.st.health) + ' · Beziehung ' + relWord(k.rel) + (ka >= 18 && k.wealth > 0 ? ' · Vermögen ' + eur(k.wealth) : '')
        + (k.partner ? '<br>' + (k.married ? 'Verheiratet mit ' : 'Partner/in: ') + esc(k.partner.first) : '') + (gk.length ? '<br>Enkel: ' + gk.join(', ') : '') + '</div>' + bar(k.rel, 'sap')
        + '<div class="btns" style="margin-top:8px">' + btn('Zeit', 'ktime', { id: k.id }, { cls: 'sm', off: !!S.turn.done['k' + k.id] || S.turn.energy < 1 }) + (ka >= 18 ? btn('Schenken', 'amount', { kind: 'gift', id: k.id }, { cls: 'sm', off: S.fin.cash < 100 }) : '') + (!heir ? btn('Als Haupterbe', 'heir', { id: k.id }, { cls: 'sm' }) : '') + '</div>' : '') + '</span></div>';
  }
  if (kids.some(k => k.alive && pAge(S, k) < 18)) ks += '<div class="field" style="margin-top:12px"><label>Förderung der Kinder (pro Kind und Jahr)</label>' + seg('foerd', Object.keys(FOERDERUNG).map(k => [k, FOERDERUNG[k].name + (FOERDERUNG[k].cost ? ' · ' + eur(FOERDERUNG[k].cost * C_(S).cost) : '')]), S.fam.foerderung, 'foerd') + '</div>';
  if (a >= 25 && a <= 55) ks += '<div class="btns" style="margin-top:12px">' + btn('Kind adoptieren · ' + eur(adoptCost(S)), 'confirm', { what: 'adopt' }, { cls: 'sm', off: S.fin.cash < adoptCost(S) || S.turn.energy < 1 }) + '</div>';
  const nGrand = sum(kids, k => (k.kids || []).length);

  if (c.aunt && c.aunt.alive) es += '<div class="item"><span class="ico">' + ic('gift') + '</span><span class="body">' + personLine(S, c.aunt, 'Tante · Beziehung ' + relWord(c.aunt.rel)) + bar(c.aunt.rel, 'sap') + '<div class="small muted" style="margin-top:4px">Wohlhabend und eigenwillig. Wer sich kümmert, wird vielleicht bedacht.</div></span><span class="r">' + btn('Besuchen', 'aunt', {}, { cls: 'sm', off: !!S.turn.done.aunt || S.turn.energy < 1 }) + '</span></div>';
  if (parentsAlive(S).length && a >= 16) es += '<div class="btns" style="margin-top:8px">' + btn('Um Geld bitten', 'askMoney', {}, { cls: 'sm', off: !!(S.flags.askedParents && S.flags.askedParents > S.year) }) + '</div>';
  for (const x of S.fam.siblings) es += item('users', personLine(S, x, gw(x.gender, 'Bruder', 'Schwester', 'Geschwister')), x.alive && x.wealth > 1000 && pAge(S, x) >= 18 ? 'Vermögen ca. ' + eur(x.wealth) : '');
  h += card('Eltern & Geschwister', es || '<div class="empty">Keine Angehörigen.</div>');
  if (S.fam.exes.length) h += card('Frühere Partner', S.fam.exes.slice(-6).map(x => item('ring', personLine(S, x, x.divorced ? 'geschieden' : x.alive ? 'getrennt' : 'verstorben'), '')).join(''));
  return h;
}
function vWill(S) {
  const w = willOf(S), heirs = heirCandidates(S);
  if (!heirs.length) return '<p class="muted small" style="margin-bottom:8px">Ohne Kinder oder Enkel gibt es kein Testament für Nachkommen. Ein entfernter Verwandter würde erben.</p>';
  let s = '<div class="field"><label>Testament</label>' + seg('will', [['haupt', 'Haupterbe'], ['gleich', 'Gleich'], ['frei', 'Frei']], w.mode, 'willMode') + '</div>';
  s += '<p class="muted small" style="margin:6px 0 8px">' + (w.mode === 'haupt' ? 'Der Haupterbe bekommt den Großteil, die anderen den Pflichtteil (Hälfte ihres gesetzlichen Anteils).' : w.mode === 'gleich' ? 'Alle ' + (heirs[0].grand ? 'Enkel' : 'Kinder') + ' erben gleich viel. Das beugt Streit vor.' : 'Lege selbst fest, wer wie viel bekommt. Wer unter den Pflichtteil fällt, klagt – das kostet den Nachlass Geld.') + '</p>';
  if (w.mode === 'frei') {
    const sh = willShares(S, heirs);
    for (const x of heirs) s += '<div class="between" style="padding:6px 0"><span>' + esc(x.first) + (x.grand ? ' <span class="muted small">(Enkel)</span>' : '') + '</span><span class="flex" style="flex-wrap:nowrap;gap:6px">' + btn('−', 'willShare', { id: x.id, d: -10 }, { cls: 'sm', title: 'Anteil verringern' }) + '<b class="num" style="min-width:48px;text-align:center">' + Math.round(sh[x.id] * 100) + ' %</b>' + btn('+', 'willShare', { id: x.id, d: 10 }, { cls: 'sm', title: 'Anteil erhöhen' }) + '</span></div>';
  }
  return s;
}
function vInheritPreview(S) {
  const plan = inheritancePlan(S, S.fam.heirId);
  if (plan.renounced) return '<div class="note bad" style="margin-top:8px">Würdest du heute sterben, wären deine Schulden höher als dein Besitz. Deine Erben würden das Erbe ausschlagen.</div>';
  let s = '<div class="sec" style="margin-top:10px">Wenn du heute stirbst</div>' + row('Nachlass (netto)', eur(plan.net));
  if (plan.spouse) s += row('Ehepartner/in', eur(plan.spouse));
  if (plan.relative) s += row('Entfernte Verwandte erben', eur(plan.heirGross));
  else {
    const heir = heirCandidates(S).find(x => x.id === plan.heirId);
    s += row((plan.mode === 'haupt' ? 'Haupterbe: ' : 'Nachfolger/in: ') + esc(heir ? heir.first : '?'), eur(plan.heirGross));
    for (const x of plan.siblings) s += row((plan.mode === 'haupt' ? 'Pflichtteil ' : 'Anteil ') + esc(x.name), eur(x.amt));
  }
  s += row('Erbschaftsteuer', negEur(plan.heirTax + plan.spouseTax + sum(plan.siblings, x => x.tax)));
  if (plan.dispute) s += '<div class="note warn" style="margin-top:8px">Erbstreit absehbar: Ein Erbe fühlt sich benachteiligt. Anwälte und Gericht kosten etwa ' + eur(plan.disputeCost) + '.</div>';
  if (plan.relative) s += '<p class="muted small" style="margin-top:6px">Ohne Kinder erbt ein entfernter Verwandter mit hoher Erbschaftsteuer.</p>';
  else s += '<p class="muted small" style="margin-top:6px">' + (plan.grand ? 'Da kein Kind mehr lebt, erben die Enkel. ' : '') + 'Wer die Familie weiterführt, übernimmt Immobilien, Firmen, Depot und Fahrzeuge. Die anderen werden in Geld ausgezahlt. Reicht das Geld nicht, wird ausgewogen aus Depot, Immobilien, Firmen und Fahrzeugen ausgezahlt.</p>';
  return s;
}

  let h = card('Dynastie ' + esc(S.dyn.name) + ' · höchstes Vermögen', c);

function deltaChips(a, b) {
  const out = [], lbl = { cash: 'Konto', nw: 'Vermögen', health: 'Gesundheit', happy: 'Glück', smarts: 'Intelligenz', stress: 'Stress' };
  for (const k in lbl) {

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const fn = ACT_UI[el.dataset.a]; if (!fn) return;
    e.preventDefault();
    try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast('Das hat nicht geklappt. Bitte versuch es erneut.', 'bad'); try { render(); } catch (e2) { /* egal */ } }
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && UI.create) UI.create[el.dataset.in] = el.value.slice(0, 24); });
  document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.change === 'housing' && UI.S) after(setHousing(UI.S, el.value)); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) ACT_UI.closeSheet(); if (e.key === 'Enter' && e.target && e.target.id === 'amt') ACT_UI.amtGo(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);
}
function boot(hotData) {
  try { document.documentElement.lang = 'de'; } catch (e) { /* egal */ }
  try { let m = document.querySelector('meta[name=viewport]'); if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); } m.content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover'; } catch (e) { /* egal */ }
  bindEvents();
  const str = (hotData && hotData.save) || Store.load();
  if (str) { try { const S = deserialize(str); UI.saveStr = str; UI.saveMeta = Object.assign(metaOf(S), { savedAt: S.savedAt }); if (hotData && hotData.save) { UI.S = S; UI.screen = 'game'; if (hotData.tab) UI.tab = hotData.tab; } } catch (e) { UI.saveStr = null; try { localStorage.setItem(SAVE_KEY + '_unlesbar_' + Date.now(), str); } catch (e2) { /* egal */ } } }
  render();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: UI.S ? serialize(UI.S) : UI.saveStr, tab: UI.tab })); } catch (e) { /* egal */ }
  cloudInit();
}
(function () {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
